name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Build installer
        working-directory: installer
        run: npm run build

      # The gitleaks gate is blocking and (since the CI=true fail-closed fix in
      # gates/gitleaks.js) FAILS when the binary is absent in CI. ubuntu-latest
      # does not ship gitleaks, so install a pinned release here.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run preflight (JSON output)
        working-directory: installer
        run: node dist/ijfw.js preflight --json > preflight-report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-report-ubuntu
          path: installer/preflight-report.json
          retention-days: 14

  preflight-windows:
    name: Preflight (windows -- PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path installer/ -Recurse -Settings installer/PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Output "PSScriptAnalyzer: all checks passed"

  check-all:
    name: check-all.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pin Node 22.x (matches the other jobs). Without this, check-all ran on the
      # runner's default Node, where node:sqlite is unavailable/partial and the
      # mcp-server suite failed ~129 sqlite-backed tests.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # check-all.sh runs the mcp-server suite, which needs better-sqlite3 +
      # chokidar. Without installing them the fresh checkout failed ~129
      # MODULE_NOT_FOUND tests.
      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci
      - name: Run check-all
        run: bash scripts/check-all.sh

  plugin-manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate plugin manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('claude/.claude-plugin/plugin.json','utf8'))"
      - name: Required plugin manifest fields
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('claude/.claude-plugin/plugin.json','utf8')); for (const k of ['name','version','description']) if(!m[k]){console.error('missing: '+k);process.exit(1);} console.log('ok')"

  trident:
    name: Trident cross-audit
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'trident')
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      # Capture the exit code instead of swallowing it with `|| true`, and keep
      # stderr OUT of the JSON report so a partial failure can never be posted
      # as if it were audit findings. The job goes red at the end (below) so
      # the comment still posts first with the honest failure context.
      - name: Run cross-audit
        id: audit
        run: |
          rc=0
          node mcp-server/bin/ijfw cross-audit --json > /tmp/trident-report.json 2> /tmp/trident-stderr.log || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Post audit results as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        run: |
          body="## Trident cross-audit\n\n"
          if [ "${AUDIT_RC:-1}" = "0" ] \
            && node -e "JSON.parse(require('fs').readFileSync('/tmp/trident-report.json','utf8'))" 2>/dev/null; then
            body="${body}\`\`\`json\n$(head -c 8000 /tmp/trident-report.json)\n\`\`\`"
          else
            body="${body}_Cross-audit FAILED (exit ${AUDIT_RC:-unknown}) or produced invalid JSON. Check workflow logs._"
            if [ -s /tmp/trident-stderr.log ]; then
              body="${body}\n\n\`\`\`\n$(head -c 2000 /tmp/trident-stderr.log)\n\`\`\`"
            fi
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(printf '%b' "$body")"

      - name: Fail job when cross-audit failed
        if: steps.audit.outputs.rc != '0'
        env:
          AUDIT_RC: ${{ steps.audit.outputs.rc }}
        run: |
          echo "cross-audit exited $AUDIT_RC" >&2
          exit 1
