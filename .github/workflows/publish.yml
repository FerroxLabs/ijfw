name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight gate (belt-and-braces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Build installer
        working-directory: installer
        run: npm run build

      # The gitleaks gate is blocking and (since the CI=true fail-closed fix in
      # gates/gitleaks.js) FAILS when the binary is absent in CI. ubuntu-latest
      # does not ship gitleaks, so install a pinned release here.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run preflight (must be green to proceed)
        working-directory: installer
        run: node dist/ijfw.js preflight --json > preflight-report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-report-release
          path: installer/preflight-report.json
          retention-days: 30

  # Release-day mirror of ci.yml's check-all job: a v* tag can land on a commit
  # that never went through (or is ahead of) main CI, so the unit suite +
  # banned-char lint + platform-drift gate must also block the publish itself.
  check-all:
    name: check-all.sh (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Node 22.x: node:sqlite is unavailable/partial on the runner default.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # check-all.sh runs the mcp-server suite, which needs better-sqlite3 +
      # chokidar installed in a fresh checkout.
      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci
      - name: Run check-all
        run: bash scripts/check-all.sh

  publish:
    name: Publish to npm
    needs: [preflight, check-all]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # Node 24.x ships npm 11.x natively, which is the version that supports
      # Trusted Publishing OIDC token exchange. Avoids the known in-place
      # `npm install -g npm@latest` self-upgrade corruption (promise-retry
      # missing mid-swap, see github.com/npm/cli/issues for the lineage).
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Build installer
        working-directory: installer
        run: npm run build

      - name: Derive dist-tag from tag name
        id: tag
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          if echo "$TAG_REF" | grep -q -- '-rc\.'; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing dist-tag: $DIST_TAG"

      # Auth: a granular npm access token (publish rights + 2FA bypass) stored as
      # the NPM_TOKEN repo secret. setup-node above wrote the registry into the
      # job .npmrc; NODE_AUTH_TOKEN supplies the credential. id-token: write still
      # lets npm attach a provenance attestation alongside token auth.
      - name: Publish @ijfw/install with provenance
        working-directory: installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Second package: the MCP memory server. Ships src as-is (no build step,
      # no prepublishOnly), so a bare publish is correct. Version is kept in
      # lockstep with the installer by the preflight gate.
      - name: Publish @ijfw/memory-server with provenance
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub Release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          # Extract section matching the tag from CHANGELOG.md
          VERSION="${TAG_REF#v}"
          notes=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md for details."
          fi
          gh release create "$TAG_REF" \
            --title "$TAG_REF" \
            --notes "$notes" \
            --verify-tag

  post-publish-smoke:
    name: Post-publish E2E (install from registry)
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: node:20
    permissions:
      contents: read
    # 1.2.1's first run was green; gating this job from 1.2.2 onward.
    steps:
      - uses: actions/checkout@v6

      - name: Install git inside container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Run post-publish smoke
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          bash scripts/post-publish-smoke.sh "$TAG_REF"
