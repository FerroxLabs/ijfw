name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight gate (belt-and-braces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Build installer
        working-directory: installer
        run: npm run build

      # The gitleaks gate is blocking and (since the CI=true fail-closed fix in
      # gates/gitleaks.js) FAILS when the binary is absent in CI. ubuntu-latest
      # does not ship gitleaks, so install a pinned release here.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run preflight (must be green to proceed)
        working-directory: installer
        run: node dist/ijfw.js preflight --json > preflight-report.json

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-report-release
          path: installer/preflight-report.json
          retention-days: 30

  # Release-day mirror of ci.yml's check-all job: a v* tag can land on a commit
  # that never went through (or is ahead of) main CI, so the unit suite +
  # banned-char lint + platform-drift gate must also block the publish itself.
  check-all:
    name: check-all.sh (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22.x: node:sqlite is unavailable/partial on the runner default.
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # check-all.sh runs the mcp-server suite, which needs better-sqlite3 +
      # chokidar installed in a fresh checkout.
      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci
      - name: Run check-all
        run: bash scripts/check-all.sh

  publish:
    name: Publish to npm
    needs: [preflight, check-all]
    runs-on: ubuntu-latest
    # WHO-can-publish gate (supply-chain hardening): the `release` environment is
    # protected in repo settings with a required reviewer, so a v* tag -- no
    # matter who pushes it -- pauses here until a human approves the deployment
    # before any npm publish runs. Pairs with the tag-creation ruleset (only the
    # release actor may create v*), applied by Overwatch outside this workflow.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24.x ships npm 11.x natively, which is the version that supports
      # Trusted Publishing OIDC token exchange. Avoids the known in-place
      # `npm install -g npm@latest` self-upgrade corruption (promise-retry
      # missing mid-swap, see github.com/npm/cli/issues for the lineage).
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install dependencies
        working-directory: installer
        run: npm ci

      - name: Build installer
        working-directory: installer
        run: npm run build

      # Supply-chain guard: the pushed tag MUST match the version being
      # published. Without this, `git tag v9.9.9` on a commit whose
      # package.json says 1.6.5 would publish 1.6.5 under a GitHub Release
      # titled v9.9.9 (the post-publish smoke caught it only AFTER the package
      # went live). check-all's version-lockstep gate already proves all 9
      # in-repo surfaces agree; this asserts the TAG agrees with them too, so
      # tag == every published version. TAG_REF via env (never inlined into the
      # run: script) per GitHub Actions injection guidance.
      - name: Assert tag matches package.json version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_REF#v}"
          INSTALLER_VER=$(node -p "require('./installer/package.json').version")
          MCP_VER=$(node -p "require('./mcp-server/package.json').version")
          if [ "$VERSION" != "$INSTALLER_VER" ]; then
            echo "::error::tag $TAG_REF (version $VERSION) != installer/package.json ($INSTALLER_VER)"
            exit 1
          fi
          if [ "$VERSION" != "$MCP_VER" ]; then
            echo "::error::tag $TAG_REF (version $VERSION) != mcp-server/package.json ($MCP_VER)"
            exit 1
          fi
          echo "tag <-> package.json version match: $VERSION"

      # npm publish triggers prepublishOnly, which re-runs the full preflight
      # INSIDE this job -- including the fail-closed gitleaks gate. The gate
      # jobs above install gitleaks for themselves; this job needs it too or
      # the publish dies at prepublishOnly (v1.6.2's first run did exactly
      # that). Keep the version pinned in lockstep with the other two installs.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Derive dist-tag from tag name
        id: tag
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          # First, STRICTLY validate the tag shape. Shell `case` globs use `*`,
          # which matches dots/letters -- so `v[0-9]*.[0-9]*.[0-9]*` would wrongly
          # accept `v1.2.3.4` / `v1.2.3extra` and route them to `latest`. An
          # anchored regex refuses anything that isn't vMAJOR.MINOR.PATCH with an
          # optional -prerelease, so a malformed tag can never default to `latest`.
          if [[ ! "$TAG_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG_REF' is not a vMAJOR.MINOR.PATCH[-prerelease] release tag; refusing to publish"
            exit 1
          fi
          # SemVer: a hyphen after MAJOR.MINOR.PATCH introduces a prerelease
          # (1.7.0-rc.1, 1.7.0-beta.2, 1.7.0-alpha.1, ...). NONE may ship to the
          # `latest` dist-tag -- `npm install @ijfw/install` must only ever
          # resolve a STABLE release. The old check matched ONLY `-rc.`, so a
          # `-beta`/`-alpha` tag silently shipped to `latest`. Now: stable ->
          # latest, ANY prerelease -> next.
          case "$TAG_REF" in
            *-*) DIST_TAG="next"   ;; # any prerelease suffix (shape already validated)
            *)   DIST_TAG="latest" ;; # clean stable release
          esac
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing dist-tag: $DIST_TAG"

      # Auth: a granular npm access token (publish rights + 2FA bypass) stored as
      # the NPM_TOKEN repo secret. setup-node above wrote the registry into the
      # job .npmrc; NODE_AUTH_TOKEN supplies the credential. id-token: write still
      # lets npm attach a provenance attestation alongside token auth.
      - name: Publish @ijfw/install with provenance
        working-directory: installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Second package: the MCP memory server. Ships src as-is (no build step,
      # no prepublishOnly), so a bare publish is correct. Version is kept in
      # lockstep with the installer by the preflight gate.
      - name: Publish @ijfw/memory-server with provenance
        working-directory: mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub Release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          # Extract section matching the tag from CHANGELOG.md
          VERSION="${TAG_REF#v}"
          notes=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md for details."
          fi
          gh release create "$TAG_REF" \
            --title "$TAG_REF" \
            --notes "$notes" \
            --verify-tag

  post-publish-smoke:
    name: Post-publish E2E (install from registry)
    needs: publish
    runs-on: ubuntu-latest
    container:
      image: node:20
    permissions:
      contents: read
    # 1.2.1's first run was green; gating this job from 1.2.2 onward.
    steps:
      - uses: actions/checkout@v7

      - name: Install git inside container
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Run post-publish smoke
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          bash scripts/post-publish-smoke.sh "$TAG_REF"
