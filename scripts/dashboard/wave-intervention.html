<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IJFW -- Wave Intervention</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --border: #c8ccd2;
    --text: #1a1d22;
    --muted: #4d5560;
    --accent: #0b5fff;
    --accent-text: #ffffff;
    --warn: #b54600;
    --warn-bg: #fff4e8;
    --danger: #a51c1c;
    --danger-bg: #fde8e8;
    --ok: #1f6f3b;
    --ok-bg: #e7f6ec;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header button.refresh {
    font: inherit;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  header button.refresh:hover { background: #eef0f3; }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .empty { color: var(--muted); padding: 32px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; background: var(--surface); }
  .wave {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .wave-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: #eef1f6;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .wave-head h2 { font-size: 14px; font-weight: 600; }
  .wave-head .meta { font-size: 12px; color: var(--muted); }
  .wave-head .blocked { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #e6e8ec; vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafbfc; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.subid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  td.action { font-size: 13px; color: var(--muted); max-width: 380px; }
  td.controls { white-space: nowrap; }
  .btn {
    font: inherit;
    font-size: 12px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 4px;
  }
  .btn:hover { background: #eef0f3; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.primary:hover { background: #0944c8; }
  .btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
  .btn.danger:hover { background: var(--danger-bg); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .swap-wrap { position: relative; display: inline-block; }
  .swap-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
    z-index: 10;
    min-width: 120px;
    display: none;
  }
  .swap-menu.open { display: block; }
  .swap-menu button {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    font-size: 12px;
    background: transparent;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--text);
  }
  .swap-menu button:hover { background: #eef0f3; }
  .status {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 600;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.err { background: var(--danger-bg); color: var(--danger); }
  .status.pending { background: var(--warn-bg); color: var(--warn); }
  dialog { border: 1px solid var(--border); border-radius: 8px; padding: 0; background: var(--surface); color: var(--text); max-width: 480px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg-body { padding: 20px; }
  .dlg-body h3 { font-size: 14px; margin-bottom: 12px; }
  .dlg-body label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .dlg-body textarea {
    width: 100%;
    font: inherit;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 12px;
    background: var(--surface);
    color: var(--text);
  }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Wave Intervention</h1>
    <div class="sub">Redispatch stuck subagents, swap AI families, or block a wave.</div>
  </div>
  <button class="refresh" id="refresh-btn" type="button">Refresh</button>
</header>
<main id="content"></main>

<dialog id="reason-dlg">
  <form class="dlg-body" id="reason-form" method="dialog">
    <h3 id="dlg-title">Reason</h3>
    <label for="dlg-reason">Reason (optional; required when blocking)</label>
    <textarea id="dlg-reason" rows="3" placeholder="e.g. stuck on test; oncall paged me; suspect bad model"></textarea>
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancel</button>
      <button class="btn primary" id="dlg-submit" value="ok" type="submit">Confirm</button>
    </div>
  </form>
</dialog>

<script>
// Pure DOM construction -- never use innerHTML on user/API data.
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('data-')) node.setAttribute(k, v);
    else if (k === 'disabled') node.disabled = !!v;
    else node.setAttribute(k, v);
  }
  if (children) for (const c of children) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

async function loadWaves() {
  const main = $('#content');
  clear(main);
  main.appendChild(el('div', { class: 'empty', text: 'Loading waves...' }));
  try {
    const res = await fetch('/api/waves', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { waves } = await res.json();
    clear(main);
    if (!waves || waves.length === 0) {
      main.appendChild(el('div', { class: 'empty', text: 'No active waves found in .ijfw/wave-*/ . Start a wave to intervene.' }));
      return;
    }
    for (const w of waves) main.appendChild(renderWave(w));
  } catch (err) {
    clear(main);
    main.appendChild(el('div', { class: 'empty', text: 'Failed to load waves: ' + err.message }));
  }
}

function renderWave(w) {
  const section = el('section', { class: 'wave', 'data-wave': w.waveId });
  const headLeft = el('div', null, [
    el('h2', null, [
      'Wave ' + w.waveId,
      w.blocked ? el('span', { class: 'blocked', text: 'Blocked' }) : null,
    ]),
    el('div', { class: 'meta', text: w.subagents.length + ' subagent(s)' }),
  ]);
  const blockBtn = el('button', {
    class: 'btn danger',
    type: 'button',
    'data-act': 'block',
    'data-wave': w.waveId,
    disabled: w.blocked,
    text: w.blocked ? 'Blocked' : 'Block wave',
  });
  const blockStatus = el('span', { class: 'status', 'data-status': 'block-' + w.waveId });
  blockStatus.hidden = true;
  const headRight = el('div', null, [blockBtn, blockStatus]);
  const head = el('div', { class: 'wave-head' }, [headLeft, headRight]);
  section.appendChild(head);

  const tbody = el('tbody');
  if (w.subagents.length === 0) {
    const emptyTd = el('td', { colspan: '4', style: 'color:var(--muted);text-align:center;padding:16px', text: 'No subagents checkpointed yet.' });
    tbody.appendChild(el('tr', null, [emptyTd]));
  } else {
    for (const s of w.subagents) tbody.appendChild(renderSub(w.waveId, s));
  }
  const table = el('table', null, [
    el('thead', null, [
      el('tr', null, [
        el('th', { text: 'Subagent' }),
        el('th', { text: 'Last action' }),
        el('th', { text: 'Updated' }),
        el('th', { text: 'Controls' }),
      ]),
    ]),
    tbody,
  ]);
  section.appendChild(table);
  return section;
}

function renderSub(waveId, s) {
  const actionCell = el('td', { class: 'action' }, [s.lastAction || '(no checkpoint)']);
  if (s.redispatchPending) actionCell.appendChild(el('span', { class: 'status pending', text: 'redispatch queued' }));
  if (s.swapAiPending) actionCell.appendChild(el('span', { class: 'status pending', text: 'swap-ai queued' }));

  const redispatchBtn = el('button', {
    class: 'btn', type: 'button',
    'data-act': 'redispatch', 'data-wave': waveId, 'data-sub': s.subId,
    text: 'Redispatch',
  });
  const swapToggle = el('button', {
    class: 'btn', type: 'button',
    'data-act': 'swap-toggle', 'data-sub': s.subId,
    text: 'Swap AI ▾',
  });
  const swapMenu = el('span', { class: 'swap-menu', 'data-menu-sub': s.subId }, [
    el('button', { type: 'button', 'data-act': 'swap', 'data-to': 'claude', 'data-wave': waveId, 'data-sub': s.subId, text: 'claude' }),
    el('button', { type: 'button', 'data-act': 'swap', 'data-to': 'codex', 'data-wave': waveId, 'data-sub': s.subId, text: 'codex' }),
    el('button', { type: 'button', 'data-act': 'swap', 'data-to': 'gemini', 'data-wave': waveId, 'data-sub': s.subId, text: 'gemini' }),
  ]);
  const swapWrap = el('span', { class: 'swap-wrap' }, [swapToggle, swapMenu]);
  const statusBadge = el('span', { class: 'status', 'data-status': 'sub-' + s.subId });
  statusBadge.hidden = true;
  const controls = el('td', { class: 'controls' }, [redispatchBtn, swapWrap, statusBadge]);

  return el('tr', { 'data-sub': s.subId }, [
    el('td', { class: 'subid', text: s.subId }),
    actionCell,
    el('td', { class: 'action', text: s.ts || '' }),
    controls,
  ]);
}

function showStatus(key, text, kind) {
  const elx = document.querySelector('[data-status="' + key + '"]');
  if (!elx) return;
  elx.textContent = text;
  elx.className = 'status ' + (kind || 'ok');
  elx.hidden = false;
}

async function postIntervention(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data;
  try { data = await res.json(); } catch { data = { ok: false, error: 'invalid response' }; }
  return Object.assign({ httpOk: res.ok }, data);
}

let dlgResolver = null;
function askReason(opts) {
  return new Promise((resolve) => {
    const dlg = $('#reason-dlg');
    $('#dlg-title').textContent = opts.title;
    $('#dlg-reason').value = '';
    $('#dlg-reason').required = !!opts.required;
    dlgResolver = resolve;
    dlg.showModal();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  $('#reason-form').addEventListener('submit', (e) => {
    const dlg = $('#reason-dlg');
    const which = e.submitter && e.submitter.value;
    const reason = $('#dlg-reason').value.trim();
    dlg.close();
    if (dlgResolver) {
      const r = dlgResolver;
      dlgResolver = null;
      r(which === 'ok' ? reason : null);
    }
  });
  $('#refresh-btn').addEventListener('click', loadWaves);
  document.body.addEventListener('click', onBodyClick);
  loadWaves();
});

function onBodyClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) {
    $$('.swap-menu.open').forEach(m => m.classList.remove('open'));
    return;
  }
  const act = t.dataset.act;
  if (act === 'swap-toggle') {
    e.preventDefault();
    const menu = document.querySelector('[data-menu-sub="' + CSS.escape(t.dataset.sub) + '"]');
    $$('.swap-menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
    if (menu) menu.classList.toggle('open');
    return;
  }
  if (act === 'redispatch') {
    e.preventDefault();
    handleRedispatch(t.dataset.wave, t.dataset.sub);
  } else if (act === 'swap') {
    e.preventDefault();
    $$('.swap-menu.open').forEach(m => m.classList.remove('open'));
    handleSwap(t.dataset.wave, t.dataset.sub, t.dataset.to);
  } else if (act === 'block') {
    e.preventDefault();
    handleBlock(t.dataset.wave);
  }
}

async function handleRedispatch(waveId, subId) {
  const reason = await askReason({ title: 'Redispatch ' + subId + '?', required: false });
  if (reason === null) return;
  showStatus('sub-' + subId, 'Requesting...', 'pending');
  const r = await postIntervention('/api/wave/' + encodeURIComponent(waveId) + '/subagent/' + encodeURIComponent(subId) + '/redispatch', { reason });
  showStatus('sub-' + subId, r.ok ? 'Requested ✓' : (r.error || 'failed'), r.ok ? 'ok' : 'err');
  if (r.ok) setTimeout(loadWaves, 800);
}

async function handleSwap(waveId, subId, toAI) {
  const reason = await askReason({ title: 'Swap ' + subId + ' to ' + toAI + '?', required: false });
  if (reason === null) return;
  showStatus('sub-' + subId, 'Swapping...', 'pending');
  const r = await postIntervention('/api/wave/' + encodeURIComponent(waveId) + '/subagent/' + encodeURIComponent(subId) + '/swap-ai', { toAI, reason });
  showStatus('sub-' + subId, r.ok ? 'Swap → ' + toAI + ' ✓' : (r.error || 'failed'), r.ok ? 'ok' : 'err');
  if (r.ok) setTimeout(loadWaves, 800);
}

async function handleBlock(waveId) {
  const reason = await askReason({ title: 'Block wave ' + waveId + '?', required: true });
  if (reason === null) return;
  if (!reason) {
    showStatus('block-' + waveId, 'Reason required', 'err');
    return;
  }
  showStatus('block-' + waveId, 'Blocking...', 'pending');
  const r = await postIntervention('/api/wave/' + encodeURIComponent(waveId) + '/block', { reason });
  showStatus('block-' + waveId, r.ok ? 'Blocked ✓' : (r.error || 'failed'), r.ok ? 'ok' : 'err');
  if (r.ok) setTimeout(loadWaves, 800);
}
</script>
</body>
</html>
